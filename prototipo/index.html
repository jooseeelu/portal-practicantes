<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impulsa · Talento eMadrid</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#edf4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121c38" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Impulsa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <script>
    try { if (localStorage.getItem("emadrid-tema") === "oscuro") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    // App instalada: pantalla de bienvenida y sin zoom (como una app nativa).
    (function () {
      var instalada = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      if (instalada) {
        document.documentElement.classList.add("pwa");
        document.querySelector('meta[name="viewport"]').setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no");
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      }
      if (instalada || /[?&]splash\b/.test(location.search)) document.documentElement.classList.add("con-splash");
    })();
  </script>
  <style>
    /* Pantalla de bienvenida (solo en la app instalada, o con ?splash): las tres barras de Impulsa crecen una tras otra,
       un destello las recorre y aparece el nombre. Sin movimiento si el sistema pide reducir animaciones. */
    .splash { display: none; }
    .con-splash .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(120% 80% at 50% 38%, #1d2a57 0%, #121c38 55%, #0b1226 100%); color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      clip-path: inset(0 0 0 0); transition: clip-path .7s cubic-bezier(.76, 0, .24, 1); }
    .splash::before { content: ""; position: absolute; left: 50%; top: 38%; width: 420px; height: 420px; transform: translate(-50%, -50%); pointer-events: none;
      background: radial-gradient(circle, rgba(20, 200, 180, .22), transparent 62%); animation: sp-halo 2.4s ease-out .6s both; }
    .splash-marca { position: relative; width: 136px; height: 136px; margin-bottom: -14px; }
    .splash-marca svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .splash-marca .b { transform-box: fill-box; transform-origin: 50% 100%; animation: sp-barra .75s cubic-bezier(.2, 1.3, .35, 1) both; }
    .splash-marca .b1 { animation-delay: .15s; } .splash-marca .b2 { animation-delay: .32s; } .splash-marca .b3 { animation-delay: .49s; }
    .splash-marca .destello { animation: sp-destello 1s cubic-bezier(.45, 0, .2, 1) 1.05s both; }
    .splash-texto { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .splash-linea { overflow: hidden; display: block; }
    .splash-linea > span { display: block; animation: sp-texto .8s cubic-bezier(.2, .9, .3, 1) both; }
    .splash-nombre > span { font-weight: 800; font-size: 34px; letter-spacing: -.03em; animation-delay: .75s; }
    .splash-sub > span { font-size: 11px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: #14c8b4; padding-left: .32em; animation: sp-letras 1s cubic-bezier(.2, .9, .3, 1) 1s both; }
    .splash-barra { position: absolute; bottom: calc(64px + env(safe-area-inset-bottom)); width: 112px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; animation: sp-ancho .6s cubic-bezier(.2, .9, .3, 1) 1.1s both; }
    .splash-barra i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #3a4a78, #8792ff, #14c8b4); animation: sp-carga 1.1s cubic-bezier(.45, 0, .55, 1) 1.3s infinite; }
    .splash.fuera { clip-path: inset(0 0 100% 0); }
    .splash.fuera > * { transition: opacity .35s ease, transform .5s cubic-bezier(.76, 0, .24, 1); opacity: 0; transform: translateY(-18px); }
    @keyframes sp-barra { 0% { transform: scaleY(0); opacity: 0; } 60% { opacity: 1; } 100% { transform: scaleY(1); } }
    @keyframes sp-destello { from { transform: translateX(-80px); } to { transform: translateX(110px); } }
    @keyframes sp-halo { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    @keyframes sp-texto { from { transform: translateY(110%); } }
    @keyframes sp-letras { from { opacity: 0; letter-spacing: .7em; } }
    @keyframes sp-ancho { from { transform: scaleX(0); } }
    @keyframes sp-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .splash *, .splash::before { animation: none !important; } .splash { transition: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/vistas.css" />
  <link rel="stylesheet" href="css/estilo.css" />
  <script type="importmap">{ "imports": { "vue": "./vendor/vue.esm-browser.prod.js" } }</script>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-marca">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="sp-barras"><rect x="12" y="34" width="10" height="18" rx="5"/><rect x="27" y="24" width="10" height="28" rx="5"/><rect x="42" y="12" width="10" height="40" rx="5"/></clipPath><linearGradient id="sp-luz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <rect class="b b1" x="12" y="34" width="10" height="18" rx="5" fill="#3A4A78"/><rect class="b b2" x="27" y="24" width="10" height="28" rx="5" fill="#8792FF"/><rect class="b b3" x="42" y="12" width="10" height="40" rx="5" fill="#14C8B4"/>
        <g clip-path="url(#sp-barras)"><rect class="destello" x="-10" y="0" width="16" height="64" fill="url(#sp-luz)" transform="skewX(-18)"/></g>
      </svg>
    </div>
    <div class="splash-texto">
      <span class="splash-linea splash-nombre"><span>Impulsa</span></span>
      <span class="splash-linea splash-sub"><span>Talento · eMadrid</span></span>
    </div>
    <div class="splash-barra"><i></i></div>
  </div>
  <div id="app"></div>
  <script>
    // Se quita la bienvenida cuando el portal está listo (y nunca antes de que termine la animación).
    (function () {
      var s = document.getElementById("splash"); if (!document.documentElement.classList.contains("con-splash")) { s.remove(); return; }
      var inicio = Date.now(), hecho = false;
      function quitar() { if (hecho) return; hecho = true; setTimeout(function () { s.classList.add("fuera"); setTimeout(function () { s.remove(); }, 800); }, Math.max(0, 1900 - (Date.now() - inicio))); }
      document.addEventListener("portal-listo", quitar); setTimeout(quitar, 8000);
    })();
    // Android y ordenador: se guarda el aviso de instalación para lanzarlo desde el menú del portal.
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__instalar = e; });
    if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
