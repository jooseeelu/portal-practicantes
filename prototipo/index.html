<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de prácticas · Gestoría eMadrid</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#edf4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090f1e" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Prácticas" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <script>
    try { if (localStorage.getItem("emadrid-tema") === "oscuro") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    // App instalada: pantalla de bienvenida y sin zoom (como una app nativa).
    (function () {
      var instalada = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      if (instalada) {
        document.documentElement.classList.add("pwa");
        document.querySelector('meta[name="viewport"]').setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no");
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      }
      if (instalada || /[?&]splash\b/.test(location.search)) document.documentElement.classList.add("con-splash");
    })();
  </script>
  <style>
    /* Pantalla de bienvenida (solo en la app instalada). Todo con líneas rectas: barridos y barras, nada circular. */
    .splash { display: none; }
    .con-splash .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: linear-gradient(160deg, #1b2850 0%, #0f1833 48%, #0b1226 100%); color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      clip-path: inset(0 0 0 0); transition: clip-path .7s cubic-bezier(.76, 0, .24, 1); }
    .splash::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px; mask-image: linear-gradient(180deg, transparent, #000 35%, #000 65%, transparent); -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000 65%, transparent); }
    .splash-marca { position: relative; width: 92px; height: 92px; overflow: hidden; animation: sp-barrido .9s cubic-bezier(.65, 0, .35, 1) .15s both; }
    .splash-marca svg { width: 100%; height: 100%; display: block; animation: sp-sube 1s cubic-bezier(.2, .9, .3, 1) .15s both; }
    .splash-marca::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 38%; left: -90%; transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255, 244, 214, .55), transparent); mix-blend-mode: overlay; animation: sp-brillo 1.1s cubic-bezier(.45, 0, .2, 1) 1s both; }
    .splash-texto { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .splash-linea { overflow: hidden; display: block; }
    .splash-linea > span { display: block; animation: sp-texto .8s cubic-bezier(.2, .9, .3, 1) both; }
    .splash-nombre > span { font-family: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 700; font-size: 27px; letter-spacing: -.02em; animation-delay: .55s; }
    .splash-sub > span { font-size: 11px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: #d9b04a; padding-left: .32em; animation: sp-letras 1s cubic-bezier(.2, .9, .3, 1) .75s both; }
    .splash-barra { position: absolute; bottom: calc(64px + env(safe-area-inset-bottom)); width: 112px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; animation: sp-ancho .6s cubic-bezier(.65, 0, .35, 1) .9s both; }
    .splash-barra i { position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, transparent, #e0b23a, transparent); animation: sp-carga 1.1s cubic-bezier(.45, 0, .55, 1) 1.2s infinite both; }
    .splash.fuera { clip-path: inset(0 0 100% 0); }
    .splash.fuera > * { transition: opacity .35s ease, transform .5s cubic-bezier(.76, 0, .24, 1); opacity: 0; transform: translateY(-18px); }
    @keyframes sp-barrido { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes sp-sube { from { transform: translateY(26px) scale(.92); } }
    @keyframes sp-brillo { to { left: 130%; } }
    @keyframes sp-texto { from { transform: translateY(110%); } }
    @keyframes sp-letras { from { opacity: 0; letter-spacing: .7em; } }
    @keyframes sp-ancho { from { transform: scaleX(0); } }
    @keyframes sp-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .splash *, .splash::after, .splash-marca::after { animation: none !important; } .splash { transition: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/vistas.css" />
  <link rel="stylesheet" href="css/estilo.css" />
  <script type="importmap">{ "imports": { "vue": "./vendor/vue.esm-browser.prod.js" } }</script>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-marca">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="sp-oro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0b23a"/><stop offset=".5" stop-color="#b8891c"/><stop offset="1" stop-color="#8a650d"/></linearGradient><clipPath id="sp-corte"><path d="M0 0H65.25V44.75H100V100H0Z"/></clipPath></defs>
        <path clip-path="url(#sp-corte)" fill="url(#sp-oro)" fill-rule="evenodd" d="M48 8a42 42 0 1 0 0 84a42 42 0 1 0 0-84Zm0 18.5a23.5 23.5 0 1 1 0 47a23.5 23.5 0 1 1 0-47Z"/><path fill="#7a590a" d="M48 22h17.25v22.75H48z"/><path fill="url(#sp-oro)" d="M48 44.75h41.6a42 42 0 0 1 .1 12.75H48z"/></svg>
    </div>
    <div class="splash-texto">
      <span class="splash-linea splash-nombre"><span>Gestoría eMadrid</span></span>
      <span class="splash-linea splash-sub"><span>Portal de prácticas</span></span>
    </div>
    <div class="splash-barra"><i></i></div>
  </div>
  <div id="app"></div>
  <script>
    // Se quita la bienvenida cuando el portal está listo (y nunca antes de que termine la animación).
    (function () {
      var s = document.getElementById("splash"); if (!document.documentElement.classList.contains("con-splash")) { s.remove(); return; }
      var inicio = Date.now(), hecho = false;
      function quitar() { if (hecho) return; hecho = true; setTimeout(function () { s.classList.add("fuera"); setTimeout(function () { s.remove(); }, 800); }, Math.max(0, 1900 - (Date.now() - inicio))); }
      document.addEventListener("portal-listo", quitar); setTimeout(quitar, 8000);
    })();
    // Android y ordenador: se guarda el aviso de instalación para lanzarlo desde el menú del portal.
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__instalar = e; });
    if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
